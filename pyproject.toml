[project]
name = "reference-system"
version = "0.1.0"
description = ""
authors = [
    {name = "leepokai",email = "kevin2005ha@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain (>=0.1.0)",
    "langchain-community (>=0.0.10)",
    "python-dotenv (>=0.19.0)",
    "typing-extensions (>=4.5.0)",
    "langchain-openai (>=0.3.4,<0.4.0)",
    "requests (>=2.32.3,<3.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "ruff (>=0.11.7,<0.12.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "web-search-agent (>=0.2.0,<0.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]

lint.fixable = ["ALL"]
lint.ignore = ["E501","F541"]
line-length = 88

lint.select = [
    "E",
    "F",
    "I",
    "W",
    "B",
    "C4",
]

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint.isort]
known-first-party = ["search", "models", "config", "utils"]

[tool.black]
line-length = 88
